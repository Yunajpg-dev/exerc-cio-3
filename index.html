<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title> 
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Calculadora</h1>
        <h2>Coloque os valores </h2>
        <h1 id="result"></h1>
        <input type="number" id="first-number">
        <input type="text" id="operator" value="+" maxlength="1">
        <input type="number" id="second-number">
        <input type="button" value="=" id="equal" onclick="calculate()">  
        <input type="button" value="C" id="clear" onclick="clearDisplay()">
    </div>
    <script src="script.js"></script>
</body>
</html>
